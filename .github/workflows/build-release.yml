name: Build Jellyfin 12 plugin

on:
  push:
    branches:
      - port/jellyfin-12-net10
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build plugin
        run: |
          dotnet build src/Jellyfin.Plugin.ImdbRatings.csproj \
            -c Release \
            -p:Version=1.4.0.0 \
            -p:AssemblyVersion=1.4.0.0 \
            -p:FileVersion=1.4.0.0 \
            -o ./output

      - name: Prepare plugin package
        run: |
          mkdir -p package
          cp output/Jellyfin.Plugin.ImdbRatings.dll package/
          cp LICENSE package/
          cp README.md package/

      # GitHub Actions creates the downloadable ZIP itself.
      # Upload the package directory to avoid a ZIP-inside-a-ZIP artifact.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-imdb-plugin-jellyfin12-1.4.0.0
          path: package/
          if-no-files-found: error
          retention-days: 30
